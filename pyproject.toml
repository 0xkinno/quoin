[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quoin"
version = "1.0.0"
description = "QUOIN: Policy-Generation Fence for Professional Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.4.0",
    "boto3>=1.26.0",
    "botocore>=1.29.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "strands-agents>=1.0.0",
    "bedrock-agentcore>=1.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
